name: bts_delivery_app
description: A Flutter app for Back-to-School delivery operations with proof of delivery and school sign-off capabilities.
publish_to: 'none'

version: 1.2.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  crypto: ^3.0.6
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.4

  # Firebase - Latest stable versions with Firebase SDK 11.x+
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.3.5

  # Navigation
  go_router: ^12.1.3

  # Data Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Image Handling
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0
  permission_handler: ^11.2.0
  file_picker: ^6.1.1
  cached_network_image: ^3.3.1
  sqflite_common_ffi: ^2.3.3

  # Signature
  signature: ^5.4.0

  # Utils
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

  # UI Components
  cupertino_icons: ^1.0.2
  heroicons_flutter: ^0.5.0
  
  # Offline & Connectivity
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.1
  
  # PDF Support
  syncfusion_flutter_pdfviewer: ^24.1.41

  # Excel Support
  syncfusion_flutter_xlsio: ^24.1.41
  open_file: ^3.3.2

  # Additional UI
  shimmer: ^3.0.0
  badges: ^3.1.2
  table_calendar: ^3.0.9

  # Calendar Integration
  device_calendar: ^4.3.2

  # Utilities
  uuid: ^4.2.2
  http: ^1.1.0

  # Maps
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.2

  # CSV & Export
  csv: ^6.0.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.11

  # Linting
  flutter_lints: ^3.0.0
  
  # Hive Code Generation
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - .env